version: '3'

services:
  lmeve:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:80:80"
#      - "80:80"            #uncomment and comment line above to make server available on network rather than local machine
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_USER=lmeve
      - DB_PASSWORD=lmpassword
      - DB_NAME_LMEVE=lmeve
      - DB_NAME_STATIC=eve_static_data

  db:
    image: mysql:8.4
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_USER=lmeve
      - MYSQL_PASSWORD=lmpassword
    ports:
      - "127.0.0.1:3306:3306"
#      - "3306:3306"    #uncomment and comment line above to make database available on network rather than local machine

  eve_data_updater:
    build:
      context: ..
      dockerfile: docker/Dockerfile.updater
    depends_on:
      - db
    environment:
      - DB_HOST=db
      - DB_USER=lmeve
      - DB_PASSWORD=lmpassword
      - DB_NAME_STATIC=eve_static_data
      - MYSQL_ROOT_PASSWORD=rootpassword

volumes:
  mysql_data:
